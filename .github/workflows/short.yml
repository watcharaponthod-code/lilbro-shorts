name: short
on:
  schedule:
    - cron: "7 */2 * * *"    # every 2 h: fewer, better clips (each script must pass the quality review)
  workflow_dispatch:
    inputs:
      test:
        description: "make a video but do not upload"
        type: boolean
        default: false
      format:
        description: "force a format id from state/formats.json (optional)"
        type: string
        default: ""
      look:
        description: "visual style: roblox (current) or anime (retro 90s TV anime, human characters)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: short
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      META_COOKIES: ${{ secrets.META_COOKIES }}
      MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
      MATON_YT_MONKEY_CONNECTION: ${{ secrets.MATON_YT_MONKEY_CONNECTION }}
      FONTS_DIR: ${{ github.workspace }}/assets/fonts
      META_MAX_MIN: "16"
      FORCE_FORMAT: ${{ inputs.format }}
      LOOK: ${{ inputs.look || vars.LOOK || 'roblox' }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: astral-sh/setup-uv@v5
      - name: tools
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq || true
            timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null && break
            sleep 10
          done
          command -v ffmpeg
          mkdir -p ~/.fonts && cp assets/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
          npm ci --silent
      - name: make and upload one short
        run: uv run -q --no-project --python 3.12 --with numpy --with requests --with "edge-tts>=7.3.1" python make.py ${{ inputs.test && '--no-upload' || '' }}
      - name: save learning state
        if: always()
        run: |
          git config user.name shorts-bot && git config user.email bot@users.noreply.github.com
          git add state && git commit -qm "run $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ github.run_id }}
          path: |
            work/*/final.mp4
            work/*/script.json
            work/*/clips/gen_result.json
            work/*/clips/fail_*.html
          retention-days: 3
          if-no-files-found: ignore
